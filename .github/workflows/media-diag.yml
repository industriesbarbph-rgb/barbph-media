name: Media diagnostic
on:
  push:
    branches: [media-diag-2026-08-31]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Consultation media alias
        shell: bash
        run: |
          set -euxo pipefail
          ALIAS='https://raw.githubusercontent.com/industriesbarbph-rgb/barbph-media/main/consultation.png'
          curl -sSIL "$ALIAS" | head -30
          curl -fsSL 'https://barbphproducts.netlify.app/.netlify/functions/catalog-feed?type=programs' -o /tmp/feed.json
          cat /tmp/feed.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/feed.json'))
          item=next(x for x in data['items'] if x['name']=='Consultation')
          print('consultation_photo_url=', item.get('photo_url'))
          assert item.get('photo_url') == 'https://raw.githubusercontent.com/industriesbarbph-rgb/barbph-media/main/consultation.png'
          PY
          cat >/tmp/test.html <<'HTML'
          <!doctype html><div id="out">waiting</div><img id="i" src="https://raw.githubusercontent.com/industriesbarbph-rgb/barbph-media/main/consultation.png"><script>setTimeout(()=>{const i=document.getElementById('i');document.getElementById('out').textContent=`complete=${i.complete} nw=${i.naturalWidth} nh=${i.naturalHeight}`},1500)</script>
          HTML
          chromium --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 --dump-dom file:///tmp/test.html 2>&1 | tee /tmp/chromium.txt
          grep -o 'complete=true nw=[0-9]* nh=[0-9]*' /tmp/chromium.txt
