name: Media diagnostic
on:
  push:
    branches: [media-diag-2026-08-31]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out media main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Create stable consultation alias
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://raw.githubusercontent.com/industriesbarbph-rgb/barbph-media/main/ChatGPT%20Image%20Aug%2031,%202026,%2004_05_16%20PM.png'
          curl -fsSL "$URL" -o consultation.png
          file consultation.png
          git config user.name "barbph-media-fix"
          git config user.email "actions@github.com"
          git add consultation.png
          if git diff --cached --quiet; then
            echo "Alias already present."
          else
            git commit -m "Add stable Consultation media alias"
            git push origin HEAD:main
          fi
