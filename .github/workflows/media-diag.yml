name: Media diagnostic
on:
  push:
    branches: [media-diag-2026-08-31]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect browser compatibility
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://raw.githubusercontent.com/industriesbarbph-rgb/barbph-media/main/ChatGPT%20Image%20Aug%2031,%202026,%2004_05_16%20PM.png'
          curl -fsSL "$URL" -o /tmp/consultation.png
          echo 'FILE:'
          file /tmp/consultation.png
          echo 'TOOLS:'
          command -v identify || true
          command -v convert || true
          command -v chromium || true
          command -v chromium-browser || true
          command -v google-chrome || true
          command -v firefox || true
          echo 'IDENTIFY:'
          identify -verbose /tmp/consultation.png 2>&1 | head -120 || true
          echo 'PAGE HEADERS:'
          curl -sSI 'https://barbphproducts.netlify.app/programs'
          echo 'RAW ALT ENCODED:'
          curl -sSIL 'https://raw.githubusercontent.com/industriesbarbph-rgb/barbph-media/main/ChatGPT%20Image%20Aug%2031%2C%202026%2C%2004_05_16%20PM.png' | head -40
